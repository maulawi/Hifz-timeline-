<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>QURRA — Hifz Timeline</title>
<meta name="description" content="See where your Hifz can take you. A calm, precise calculator for planning your memorisation journey.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-green:#0B3026;
    --forest-green:#123D31;
    --cream:#F4EBD8;
    --ivory:#FAF6EC;
    --gold:#B89A5A;
    --soft-gold:#D7C28A;
    --charcoal:#1F211D;
    --olive:#66685F;
    --border-gold:#CDBD98;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --arabic: 'Amiri', 'Traditional Arabic', serif;
    --shadow-sm: 0 1px 2px rgba(31,33,29,0.06), 0 1px 1px rgba(31,33,29,0.04);
    --shadow-md: 0 4px 16px rgba(11,48,38,0.08);
    --shadow-lg: 0 12px 32px rgba(11,48,38,0.12);
    --radius: 14px;
    --radius-sm: 10px;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--ivory);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(184,154,90,0.05), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(11,48,38,0.04), transparent 45%);
    color:var(--charcoal);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion:no-preference){
    .fade-in{ animation:fadeIn 260ms ease both; }
    .rise-in{ animation:riseIn 300ms ease both; }
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes riseIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 20px 64px;
  }

  /* ---------- HEADER ---------- */
  header.top{
    position:relative;
    padding:38px 20px 28px;
    text-align:center;
    border-bottom:1px solid var(--border-gold);
    background:linear-gradient(180deg, rgba(184,154,90,0.06), transparent);
  }
  .brand-mark{
    font-family:var(--serif);
    font-weight:600;
    font-size:15px;
    letter-spacing:6px;
    color:var(--deep-green);
    margin:0;
  }
  .tagline{
    font-family:var(--sans);
    font-size:10.5px;
    letter-spacing:3px;
    color:var(--gold);
    text-transform:uppercase;
    margin:6px 0 22px;
    font-weight:600;
  }
  .app-title{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(28px, 6vw, 40px);
    color:var(--deep-green);
    margin:0;
    letter-spacing:0.3px;
  }
  .app-subtitle{
    font-size:14.5px;
    color:var(--olive);
    margin:10px auto 0;
    max-width:420px;
  }

  /* ---------- LANGUAGE TOGGLE ---------- */
  .lang-toggle{
    position:absolute;
    top:18px;
    right:14px;
    display:flex;
    align-items:stretch;
    border:1px solid var(--border-gold);
    border-radius:22px;
    overflow:hidden;
    background:var(--ivory);
    box-shadow:var(--shadow-sm);
  }
  .lang-toggle button{
    font-family:var(--sans);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:0 14px;
    min-width:44px;
    min-height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:transparent;
    color:var(--olive);
    cursor:pointer;
    transition:background 150ms ease, color 150ms ease;
  }
  .lang-toggle button + button{
    border-left:1px solid var(--border-gold);
  }
  .lang-toggle button.active{
    background:var(--deep-green);
    color:var(--cream);
  }
  .lang-toggle button:not(.active):hover{
    background:rgba(184,154,90,0.14);
    color:var(--deep-green);
  }
  .lang-toggle button:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:-3px;
  }
  @media (max-width:360px){
    .lang-toggle{ top:12px; right:10px; }
    .lang-toggle button{ min-width:38px; min-height:36px; padding:0 10px; font-size:11px; }
  }

  /* ---------- STEP INDICATOR ---------- */
  .step-indicator{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:22px 20px 0;
    font-size:11.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--olive);
  }
  .step-indicator .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--border-gold);
  }
  .step-indicator .step-label{
    padding:3px 0;
  }
  .step-indicator .step-label.active{
    color:var(--deep-green);
    font-weight:600;
  }

  /* ---------- SECTIONS / CARDS ---------- */
  .section{
    margin-top:32px;
  }
  .card{
    background:var(--ivory);
    border:1px solid var(--border-gold);
    border-radius:var(--radius);
    padding:24px 22px;
    box-shadow:var(--shadow-sm);
  }
  .section-heading{
    font-family:var(--serif);
    font-weight:600;
    font-size:24px;
    color:var(--deep-green);
    margin:0 0 4px;
  }
  .section-sub{
    font-size:13.5px;
    color:var(--olive);
    margin:0 0 18px;
  }
  .field-label{
    font-size:13px;
    font-weight:600;
    color:var(--charcoal);
    margin:0 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--border-gold), transparent);
    margin:26px 0;
    border:none;
  }

  /* ---------- JUZ GRID ---------- */
  .juz-toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
  }
  .btn-chip{
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:600;
    color:var(--deep-green);
    background:transparent;
    border:1px solid var(--border-gold);
    border-radius:20px;
    padding:7px 14px;
    cursor:pointer;
    transition:background 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  .btn-chip:hover{ background:rgba(184,154,90,0.1); }
  .btn-chip:active{ transform:scale(0.98); }

  .range-inline{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
    padding:12px;
    background:rgba(184,154,90,0.06);
    border-radius:var(--radius-sm);
    border:1px solid var(--border-gold);
  }
  .range-inline label{
    font-size:12px;
    color:var(--olive);
    font-weight:600;
  }
  .range-inline select{
    font-family:var(--sans);
    font-size:13px;
    padding:6px 8px;
    border-radius:8px;
    border:1px solid var(--border-gold);
    background:var(--ivory);
    color:var(--charcoal);
  }

  .juz-grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:8px;
    margin-bottom:16px;
  }
  @media (max-width:420px){
    .juz-grid{ grid-template-columns:repeat(5, 1fr); }
  }
  .juz-cell{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    color:var(--charcoal);
    background:var(--ivory);
    border:1.5px solid var(--border-gold);
    border-radius:9px;
    cursor:pointer;
    user-select:none;
    transition:background 150ms ease, border-color 150ms ease, color 150ms ease, transform 150ms ease;
  }
  .juz-cell:hover{ border-color:var(--gold); }
  .juz-cell.selected{
    background:var(--deep-green);
    border-color:var(--deep-green);
    color:var(--cream);
  }
  .juz-cell:active{ transform:scale(0.94); }

  .juz-summary{
    background:rgba(11,48,38,0.04);
    border:1px solid var(--border-gold);
    border-radius:var(--radius-sm);
    padding:14px 16px;
  }
  .juz-summary .count{
    font-family:var(--serif);
    font-size:19px;
    font-weight:600;
    color:var(--deep-green);
    margin:0 0 3px;
  }
  .juz-summary .list{
    font-size:12.5px;
    color:var(--olive);
    margin:0;
    line-height:1.6;
  }

  /* ---------- RADIO / OPTION GROUPS ---------- */
  .option-group{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .option-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border:1.5px solid var(--border-gold);
    border-radius:var(--radius-sm);
    cursor:pointer;
    background:var(--ivory);
    transition:border-color 150ms ease, background 150ms ease;
  }
  .option-row:hover{ border-color:var(--gold); }
  .option-row.selected{
    border-color:var(--deep-green);
    background:rgba(11,48,38,0.045);
  }
  .option-row input[type=radio]{
    accent-color:var(--deep-green);
    width:16px;height:16px;
    flex-shrink:0;
  }
  .option-row .option-text{
    font-size:13.5px;
    font-weight:500;
    color:var(--charcoal);
  }
  .option-sub-panel{
    margin-top:8px;
    padding:14px;
    background:rgba(184,154,90,0.06);
    border:1px solid var(--border-gold);
    border-radius:var(--radius-sm);
    display:none;
  }
  .option-sub-panel.visible{ display:block; }
  .option-sub-panel select,
  .option-sub-panel input[type=date]{
    width:100%;
    font-family:var(--sans);
    font-size:14px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border-gold);
    background:var(--ivory);
    color:var(--charcoal);
  }

  .inline-error{
    font-size:12.5px;
    color:#8a4a2b;
    background:rgba(184,90,90,0.09);
    border:1px solid rgba(184,90,90,0.35);
    border-radius:8px;
    padding:9px 12px;
    margin-top:10px;
    display:none;
  }
  .inline-error.visible{ display:block; }

  /* ---------- PACE CHIP GRID (step 2) ---------- */
  .pace-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:9px;
    margin-bottom:6px;
  }
  @media (max-width:380px){
    .pace-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  .pace-cell{
    padding:14px 8px;
    text-align:center;
    border:1.5px solid var(--border-gold);
    border-radius:var(--radius-sm);
    cursor:pointer;
    background:var(--ivory);
    font-size:13.5px;
    font-weight:600;
    color:var(--charcoal);
    transition:background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .pace-cell:hover{ border-color:var(--gold); }
  .pace-cell.selected{
    background:var(--deep-green);
    border-color:var(--deep-green);
    color:var(--cream);
  }

  .custom-pace-row{
    display:none;
    align-items:center;
    gap:10px;
    margin:14px 0 6px;
    padding:12px 14px;
    background:rgba(184,154,90,0.06);
    border:1px solid var(--border-gold);
    border-radius:var(--radius-sm);
  }
  .custom-pace-row.visible{ display:flex; flex-wrap:wrap; }
  .custom-pace-row label{ font-size:12.5px; font-weight:600; color:var(--olive); }
  .custom-pace-row input[type=number]{
    width:110px;
    font-family:var(--sans);
    font-size:14px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--border-gold);
    background:var(--ivory);
    color:var(--charcoal);
  }

  .days-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:6px;
    margin-bottom:6px;
  }
  @media (max-width:360px){
    .days-grid{ grid-template-columns:repeat(4, 1fr); }
  }
  .day-cell{
    padding:11px 4px;
    text-align:center;
    border:1.5px solid var(--border-gold);
    border-radius:9px;
    cursor:pointer;
    background:var(--ivory);
    font-size:13px;
    font-weight:600;
    color:var(--charcoal);
    transition:background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .day-cell:hover{ border-color:var(--gold); }
  .day-cell.selected{
    background:var(--deep-green);
    border-color:var(--deep-green);
    color:var(--cream);
  }

  .time-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
  }
  @media (max-width:380px){
    .time-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  .time-cell{
    padding:11px 6px;
    text-align:center;
    border:1.5px solid var(--border-gold);
    border-radius:9px;
    cursor:pointer;
    background:var(--ivory);
    font-size:12.5px;
    font-weight:600;
    color:var(--charcoal);
    transition:background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .time-cell:hover{ border-color:var(--gold); }
  .time-cell.selected{
    background:var(--soft-gold);
    border-color:var(--gold);
    color:var(--deep-green);
  }
  .time-note{
    font-size:12px;
    color:var(--olive);
    margin-top:10px;
    font-style:italic;
  }

  /* ---------- BUTTONS ---------- */
  .btn-row{
    display:flex;
    gap:10px;
    margin-top:26px;
  }
  .btn{
    font-family:var(--sans);
    font-size:14.5px;
    font-weight:600;
    padding:14px 22px;
    border-radius:11px;
    border:1.5px solid transparent;
    cursor:pointer;
    transition:background 160ms ease, border-color 160ms ease, transform 80ms ease, opacity 160ms ease;
    flex:1;
    text-align:center;
  }
  .btn:active{ transform:scale(0.985); }
  .btn-primary{
    background:var(--deep-green);
    color:var(--cream);
  }
  .btn-primary:hover{ background:var(--forest-green); }
  .btn-secondary{
    background:transparent;
    border-color:var(--border-gold);
    color:var(--deep-green);
  }
  .btn-secondary:hover{ border-color:var(--gold); background:rgba(184,154,90,0.08); }
  .btn-full{ flex:1 1 100%; }

  /* ---------- RESULTS ---------- */
  .hero-journey{
    text-align:center;
    padding:8px 0 4px;
  }
  .hero-journey .eyebrow{
    font-size:11.5px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin:0 0 12px;
  }
  .hero-journey .journey-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .hero-journey .juz-num{
    font-family:var(--serif);
    font-size:clamp(36px, 10vw, 54px);
    font-weight:700;
    color:var(--deep-green);
    line-height:1;
  }
  .hero-journey .juz-caption{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--olive);
    margin-top:4px;
  }
  .hero-journey .arrow{
    font-size:22px;
    color:var(--gold);
  }
  .completion-line{
    text-align:center;
    margin-top:22px;
  }
  .completion-line .label{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--olive);
    margin:0 0 6px;
  }
  .completion-line .value{
    font-family:var(--serif);
    font-size:30px;
    font-weight:600;
    color:var(--deep-green);
    margin:0;
  }
  .completion-line .pace-note{
    font-size:13px;
    color:var(--olive);
    margin-top:6px;
  }

  .fully-memorised-banner{
    text-align:center;
    padding:20px 16px;
  }
  .fully-memorised-banner .icon{
    font-size:30px;
    margin-bottom:10px;
    color:var(--gold);
  }
  .fully-memorised-banner p{
    font-family:var(--serif);
    font-size:19px;
    color:var(--deep-green);
    margin:0;
  }

  /* Summary card grid */
  .summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--border-gold);
    border:1px solid var(--border-gold);
    border-radius:var(--radius-sm);
    overflow:hidden;
    margin-top:10px;
  }
  .summary-cell{
    background:var(--ivory);
    padding:16px 14px;
  }
  .summary-cell .k{
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--olive);
    font-weight:700;
    margin:0 0 6px;
  }
  .summary-cell .v{
    font-family:var(--serif);
    font-size:19px;
    font-weight:600;
    color:var(--deep-green);
    margin:0;
    line-height:1.25;
  }
  .summary-cell.full{ grid-column:1 / -1; }

  /* Target date comparison */
  .target-compare{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:14px;
  }
  @media (max-width:480px){
    .target-compare{ grid-template-columns:1fr; }
  }
  .target-compare .tc-box{
    padding:14px 16px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border-gold);
    background:rgba(184,154,90,0.05);
  }
  .target-compare .tc-box.required{
    background:rgba(11,48,38,0.045);
    border-color:var(--deep-green);
  }
  .tc-box .tc-label{
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--olive);
    font-weight:700;
    margin:0 0 6px;
  }
  .tc-box .tc-value{
    font-size:15px;
    font-weight:600;
    color:var(--deep-green);
    margin:0;
  }

  /* ---------- TIMELINE ---------- */
  .timeline-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:24px 4px 16px;
    margin:0 -4px;
  }
  .timeline-track{
    display:flex;
    align-items:flex-end;
    min-width:max-content;
    padding:0 8px;
  }
  .timeline-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    width:38px;
    flex-shrink:0;
  }
  .timeline-item .connector{
    position:absolute;
    top:17px;
    left:-19px;
    width:38px;
    height:2px;
    background:var(--border-gold);
    z-index:0;
  }
  .timeline-item:first-child .connector{ display:none; }
  .timeline-item.completed .connector{ background:var(--gold); }
  .timeline-item .node{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:700;
    z-index:1;
    border:2px solid var(--border-gold);
    background:var(--ivory);
    color:var(--olive);
    transition:background 200ms ease, border-color 200ms ease, color 200ms ease;
  }
  .timeline-item.completed .node{
    background:var(--deep-green);
    border-color:var(--deep-green);
    color:var(--soft-gold);
  }
  .timeline-item.current .node{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--deep-green);
    box-shadow:0 0 0 4px rgba(184,154,90,0.22);
  }
  .timeline-item.target .node{
    border-color:var(--deep-green);
    border-style:dashed;
  }
  .timeline-item .here-tag{
    position:absolute;
    top:-22px;
    font-size:8.5px;
    letter-spacing:1px;
    font-weight:700;
    color:var(--deep-green);
    white-space:nowrap;
    background:var(--soft-gold);
    padding:2px 6px;
    border-radius:6px;
  }
  .timeline-item .target-tag{
    position:absolute;
    bottom:-20px;
    font-size:8.5px;
    letter-spacing:0.5px;
    font-weight:700;
    color:var(--deep-green);
    white-space:nowrap;
  }
  .timeline-legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    font-size:11.5px;
    color:var(--olive);
    margin-top:14px;
  }
  .timeline-legend .lg-item{ display:flex; align-items:center; gap:6px; }
  .timeline-legend .lg-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  /* ---------- MILESTONE ---------- */
  .milestone-box{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .milestone-box .m-juz{
    font-family:var(--serif);
    font-size:32px;
    font-weight:700;
    color:var(--deep-green);
    flex-shrink:0;
  }
  .milestone-box .m-text p{ margin:0; font-size:13.5px; color:var(--olive); }

  /* ---------- PACE COMPARISON LIST ---------- */
  .compare-list{
    display:flex;

/* t(key, vars) — centralized translation helper.
   Looks up `key` in the current language dictionary, falling back to
   English, then to the raw key. Supports {placeholder} substitution. */
function t(key, vars){
  const dict = I18N[state.language] || I18N.en;
  let str = dict[key];
  if (str === undefined) str = (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if (vars){
    Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  }
  return str;
}

/* =========================================================
   STATE
   ========================================================= */
function defaultState(){
  return {
    screen: 'step1', // 'step1' | 'step2' | 'results'
    selectedJuz: new Set(),
    planMode: 'all30', // 'all30' | 'specificJuz' | 'targetDate'
    targetJuzNumber: null,
    targetDate: '',
    pacePresetId: 'half',
    customPagesPerDay: '',
    daysPerWeek: null,
    timeOption: null,
    step1ErrorKey: '',
    step2ErrorKey: '',
    rangeFrom: null,
    rangeTo: null
  };
}
var state = defaultState();
state.language = loadLanguagePreference(); // 'en' | 'bm' — independent of calculator state / resets

function loadLanguagePreference(){
  try {
    const v = window.localStorage.getItem('qurra_hifz_timeline_language');
    if (v === 'en' || v === 'bm') return v;
  } catch (e) { /* localStorage unavailable — fall back silently */ }
  return 'en';
}
function persistLanguage(lang){
  try { window.localStorage.setItem('qurra_hifz_timeline_language', lang); } catch (e) { /* best-effort only */ }
}
function setLanguage(lang){
  if (lang !== 'en' && lang !== 'bm') return;
  if (state.language === lang) return;
  state.language = lang;
  persistLanguage(lang);
  render();
}

/* =========================================================
   CALCULATION FUNCTIONS
   (all numeric logic unchanged — only display-string generation
   below is language-aware)
   ========================================================= */
function getSelectedJuzSorted(){
  return Array.from(state.selectedJuz).sort((a,b)=>a-b);
}

function getUnfinishedJuzSorted(){
  const out = [];
  for (let j=1;j<=TOTAL_JUZ;j++){ if (!state.selectedJuz.has(j)) out.push(j); }
  return out;
}

function formatJuzRanges(sortedArr){
  if (!sortedArr.length) return t('noneYet');
  const ranges = [];
  let start = sortedArr[0], end = sortedArr[0];
  for (let i=1;i<sortedArr.length;i++){
    if (sortedArr[i] === end+1){ end = sortedArr[i]; }
    else { ranges.push(start===end ? `${start}` : `${start}–${end}`); start = sortedArr[i]; end = sortedArr[i]; }
  }
  ranges.push(start===end ? `${start}` : `${start}–${end}`);
  return 'Juz ' + ranges.join(', ');
}

function getCurrentMemorisedPages(){
  return state.selectedJuz.size * PAGES_PER_JUZ;
}

function getDailyPagesPerDay(){
  if (state.pacePresetId === 'custom'){
    const v = parseFloat(state.customPagesPerDay);
    return (isFinite(v) && v > 0) ? v : 0;
  }
  const preset = PACE_PRESETS.find(p => p.id === state.pacePresetId);
  return preset ? preset.value : 0;
}

function getPaceLabel(){
  if (state.pacePresetId === 'custom'){
    const v = parseFloat(state.customPagesPerDay);
    return (isFinite(v) && v > 0) ? `${formatNum(v)} ${t('pagesUnit')}` : t('paceCustom');
  }
  const preset = PACE_PRESETS.find(p => p.id === state.pacePresetId);
  return preset ? t(preset.key) : '';
}

function getWeeklyPace(){
  const pagesPerDay = getDailyPagesPerDay();
  const days = state.daysPerWeek || 0;
  return pagesPerDay * days;
}

function isFullyMemorised(){
  return state.selectedJuz.size >= TOTAL_JUZ;
}

/* Target pages for the "all30" / "targetDate" plan modes (whole Quran). */
function getRemainingPagesForFullPlan(){
  return Math.max(TOTAL_QURAN_PAGES - getCurrentMemorisedPages(), 0);
}

/* Target pages for "specificJuz" plan mode, using the ascending
   fill-in-order model: the user completes the next unfinished Juz,
   in ascending order, one at a time. */
function getStepsToReachJuz(targetJuz){
  const unfinished = getUnfinishedJuzSorted();
  const idx = unfinished.indexOf(targetJuz);
  if (idx === -1) return 0; // already memorised
  return idx + 1;
}

function getRemainingPagesForTarget(){
  if (state.planMode === 'specificJuz' && state.targetJuzNumber){
    if (state.selectedJuz.has(state.targetJuzNumber)) return 0;
    return getStepsToReachJuz(state.targetJuzNumber) * PAGES_PER_JUZ;
  }
  // all30 and targetDate both target the full Quran
  return getRemainingPagesForFullPlan();
}

function getEstimatedWeeks(remainingPages, weeklyPace){
  if (remainingPages <= 0) return 0;
  if (!(weeklyPace > 0)) return Infinity;
  return remainingPages / weeklyPace;
}

function formatNum(n, decimals){
  if (!isFinite(n)) return '—';
  const d = decimals === undefined ? 1 : decimals;
  const rounded = Math.round(n * Math.pow(10,d)) / Math.pow(10,d);
  return rounded % 1 === 0 ? String(rounded) : rounded.toFixed(d);
}

function formatDuration(weeks){
  if (!isFinite(weeks)) return t('notCalculable');
  if (weeks <= 0) return t('alreadyReachedShort');
  if (weeks < 1) return t('lessThanWeek');
  if (weeks < 8) {
    const w = Math.round(weeks);
    return `${w} ${w===1 ? t('durWeek') : t('durWeeks')}`;
  }
  const months = weeks / WEEKS_PER_MONTH;
  if (months < 18){
    const m = formatNum(months, months < 3 ? 1 : 0);
    return `~${m} ${m==='1' ? t('durMonth') : t('durMonths')}`;
  }
  const years = weeks / WEEKS_PER_YEAR;
  const y = formatNum(years, years < 5 ? 1 : 0);
  return `~${y} ${y==='1' ? t('durYear') : t('durYears')}`;
}

function getNextMilestone(){
  if (isFullyMemorised()) return null;
  const unfinished = getUnfinishedJuzSorted();
  const nextJuz = unfinished[0];
  const weeklyPace = getWeeklyPace();
  const weeks = weeklyPace > 0 ? PAGES_PER_JUZ / weeklyPace : Infinity;
  return { nextJuz, weeks };
}

function getRequiredPaceForTargetDate(){
  if (!state.targetDate) return { invalid:true, reason:'missing' };
  const target = new Date(state.targetDate + 'T00:00:00');
  if (isNaN(target.getTime())) return { invalid:true, reason:'missing' };
  const today = startOfDay(new Date());
  const msPerWeek = 7 * 24 * 60 * 60 * 1000;
  const weeksAvailable = (target.getTime() - today.getTime()) / msPerWeek;
  if (weeksAvailable <= 0) return { invalid:true, reason:'past', targetDateObj: target };

  if (isFullyMemorised()) return { invalid:true, reason:'alreadyReached' };
  const remainingPages = getRemainingPagesForFullPlan();

  const requiredWeeklyPace = remainingPages / weeksAvailable;
  const requiredDaysPerWeek = (state.daysPerWeek && state.daysPerWeek > 0) ? state.daysPerWeek : 6;
  const requiredPagesPerDay = requiredWeeklyPace / requiredDaysPerWeek;
  return { invalid:false, requiredWeeklyPace, requiredPagesPerDay, requiredDaysPerWeek, weeksAvailable, targetDateObj: target };
}

function paceValueLabel(pages){
  if (pages === 0.25) return t('paceQuarter');
  if (pages === 0.5) return t('paceHalf');
  if (pages === 1) return t('paceOne');
  if (pages === 2) return t('paceTwo');
  return `${formatNum(pages)} ${t('pagesUnit')}`;
}

function getPaceComparisonRows(){
  const remainingPages = getRemainingPagesForTarget();
  if (remainingPages <= 0) return [];
  const rows = COMPARISON_SCENARIOS.map(sc => {
    const weeklyPace = sc.pages * sc.days;
    const weeks = getEstimatedWeeks(remainingPages, weeklyPace);
    return {
      label: `${paceValueLabel(sc.pages)} × ${sc.days} ${t('daysPerWeekUnit')}`,
      duration: formatDuration(weeks),
      isUserPace: false
    };
  });

  const userPagesPerDay = getDailyPagesPerDay();
  const userDays = state.daysPerWeek || 0;
  let matched = false;
  if (userPagesPerDay > 0 && userDays > 0){
    for (const sc of COMPARISON_SCENARIOS){
      if (Math.abs(sc.pages - userPagesPerDay) < 0.001 && sc.days === userDays){ matched = true; break; }
    }
  }
  rows.forEach((r,i) => {
    const sc = COMPARISON_SCENARIOS[i];
    if (userPagesPerDay > 0 && userDays > 0 && Math.abs(sc.pages - userPagesPerDay) < 0.001 && sc.days === userDays){
      r.isUserPace = true;
    }
  });

  if (!matched && userPagesPerDay > 0 && userDays > 0){
    const weeklyPace = userPagesPerDay * userDays;
    const weeks = getEstimatedWeeks(remainingPages, weeklyPace);
    rows.push({
      label: `${paceValueLabel(userPagesPerDay)} × ${userDays} ${t('daysPerWeekUnit')}`,
      duration: formatDuration(weeks),
      isUserPace: true
    });
  }
  return rows;
}

function getJourneyByYear(){
  if (isFullyMemorised()) return [];
  const weeklyPace = getWeeklyPace();
  if (!(weeklyPace > 0)) return [];

  const unfinished = getUnfinishedJuzSorted();
  const today = new Date();
  let stopAtJuz = null;
  if (state.planMode === 'specificJuz' && state.targetJuzNumber && !state.selectedJuz.has(state.targetJuzNumber)){
    stopAtJuz = state.targetJuzNumber;
  }

  const yearMap = new Map();
  const order = [];
  let cumPages = 0;

  for (let i=0;i<unfinished.length;i++){
    const juz = unfinished[i];
    cumPages += PAGES_PER_JUZ;
    const weeks = cumPages / weeklyPace;
    const days = Math.round(weeks * 7);
    const completionDate = addDays(today, days);
    const year = completionDate.getFullYear();
    if (!yearMap.has(year)){
      yearMap.set(year, { first: juz, last: juz });
      order.push(year);
    } else {
      yearMap.get(year).last = juz;
    }
    if (stopAtJuz !== null && juz === stopAtJuz) break;
  }

  return order.map(year => {
    const { first, last } = yearMap.get(year);
    return { year, first, last };
  });
}

/* =========================================================
   DATE FUNCTIONS
   ========================================================= */
function startOfDay(d){
  const c = new Date(d);
  c.setHours(0,0,0,0);
  return c;
}

function addDays(date, days){
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function formatDateHuman(date){
  const months = MONTHS[state.language] || MONTHS.en;
  return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
}

function formatMonthYear(date){
  const months = MONTHS[state.language] || MONTHS.en;
  return `${months[date.getMonth()]} ${date.getFullYear()}`;
}

function todayISODate(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

/* --- lightweight, targeted updates (no full re-render) --- */
function updateJuzSelectionUI(){
  const grid = document.getElementById('juzGrid');
  if (grid){
    grid.querySelectorAll('.juz-cell').forEach(cell => {
      const j = parseInt(cell.dataset.juz, 10);
      cell.classList.toggle('selected', state.selectedJuz.has(j));
      cell.setAttribute('aria-pressed', state.selectedJuz.has(j));
    });
  }
  const countEl = document.getElementById('juzCount');
  const listEl = document.getElementById('juzList');
  if (countEl) countEl.textContent = t('juzMemorisedCount', {n: state.selectedJuz.size});
  if (listEl) listEl.textContent = t('memorisedList', {list: state.selectedJuz.size ? formatJuzRanges(getSelectedJuzSorted()) : t('noneYet')});

  // Refresh target-Juz dropdown "(already memorised)" annotations without losing selection.
  const targetSelect = document.getElementById('targetJuzSelect');
  if (targetSelect){
    const currentVal = targetSelect.value;
    Array.from(targetSelect.options).forEach(opt => {
      if (!opt.value) return;
      const j = parseInt(opt.value, 10);
      opt.textContent = `Juz ${j}${state.selectedJuz.has(j) ? ' ' + t('alreadyMemorisedSuffix') : ''}`;
    });
    targetSelect.value = currentVal;
  }
}

  state.step1ErrorKey = '';
  const el = document.getElementById('step1Error');
  if (el){ el.textContent = ''; el.classList.remove('visible'); }
}
function showStep1Error(key){
  state.step1ErrorKey = key;
  const el = document.getElementById('step1Error');
  if (el){ el.textContent = t(key); el.classList.add('visible'); }
}
function clearStep2Error(){
  state.step2ErrorKey = '';
  const el = document.getElementById('step2Error');
  if (el){ el.textContent = ''; el.classList.remove('visible'); }
}
function showStep2Error(key){
  state.step2ErrorKey = key;

function afterRenderBindings(){
  if (state.screen === 'step1') bindStep1();
  else if (state.screen === 'step2') bindStep2();
  else bindResults();
}

function bindStep1(){
  const grid = document.getElementById('juzGrid');
  grid.addEventListener('click', (e) => {
    const cell = e.target.closest('.juz-cell');
    if (!cell) return;
    const j = parseInt(cell.dataset.juz, 10);
    if (state.selectedJuz.has(j)) state.selectedJuz.delete(j);
    else state.selectedJuz.add(j);
    updateJuzSelectionUI();
  });

  document.querySelector('[data-action="open-range"]').addEventListener('click', () => {
    const panel = document.getElementById('rangePanel');
    panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
  });
  document.querySelector('[data-action="select-all"]').addEventListener('click', () => {
    for (let j=1;j<=TOTAL_JUZ;j++) state.selectedJuz.add(j);
    updateJuzSelectionUI();
  });
  document.querySelector('[data-action="clear-all"]').addEventListener('click', () => {
    state.selectedJuz.clear();
    updateJuzSelectionUI();
  });
  document.querySelector('[data-action="apply-range"]').addEventListener('click', () => {
    const from = parseInt(document.getElementById('rangeFrom').value, 10);
    const to = parseInt(document.getElementById('rangeTo').value, 10);
    const lo = Math.min(from, to), hi = Math.max(from, to);
    for (let j=lo;j<=hi;j++) state.selectedJuz.add(j);
    updateJuzSelectionUI();
  });

  // Plan mode radios
  const planModeGroup = document.getElementById('planModeGroup');
  planModeGroup.querySelectorAll('.option-row').forEach(row => {
    row.addEventListener('click', () => {
      const mode = row.dataset.mode;
      state.planMode = mode;
      clearStep1Error();
      planModeGroup.querySelectorAll('.option-row').forEach(r => r.classList.toggle('selected', r.dataset.mode === mode));
      planModeGroup.querySelectorAll('input[type=radio]').forEach(r => { r.checked = (r.value === mode); });
      document.getElementById('specificJuzPanel').classList.toggle('visible', mode === 'specificJuz');
      document.getElementById('targetDatePanel').classList.toggle('visible', mode === 'targetDate');
    });
  });

  const targetJuzSelect = document.getElementById('targetJuzSelect');
  targetJuzSelect.addEventListener('change', () => {
    const v = parseInt(targetJuzSelect.value, 10);
    state.targetJuzNumber = isFinite(v) ? v : null;
    clearStep1Error();
  });

  const targetDateInput = document.getElementById('targetDateInput');
  targetDateInput.addEventListener('input', () => {
    state.targetDate = targetDateInput.value;
    clearStep1Error();
  });

  document.querySelector('[data-action="go-step2"]').addEventListener('click', () => {
    if (state.planMode === 'specificJuz' && !state.targetJuzNumber){
      showStep1Error('errTargetJuz');
      return;
    }
    if (state.planMode === 'targetDate' && !state.targetDate){
      showStep1Error('errTargetDate');
      return;
    }
    clearStep1Error();
    state.screen = 'step2';
    render();
  });
}

function bindStep2(){
  const paceGrid = document.getElementById('paceGrid');
  paceGrid.addEventListener('click', (e) => {
    const cell = e.target.closest('.pace-cell');
    if (!cell) return;
    state.pacePresetId = cell.dataset.pace;
    clearStep2Error();
    paceGrid.querySelectorAll('.pace-cell').forEach(c => c.classList.toggle('selected', c.dataset.pace === state.pacePresetId));
    document.getElementById('customPaceRow').classList.toggle('visible', state.pacePresetId === 'custom');
    if (state.pacePresetId === 'custom') document.getElementById('customPaceInput').focus();
  });

  document.getElementById('customPaceInput').addEventListener('input', (e) => {
    state.customPagesPerDay = e.target.value;
    clearStep2Error();
  });

  const daysGrid = document.getElementById('daysGrid');
  daysGrid.addEventListener('click', (e) => {
    const cell = e.target.closest('.day-cell');
    if (!cell) return;
    state.daysPerWeek = parseInt(cell.dataset.day, 10);
    clearStep2Error();
    daysGrid.querySelectorAll('.day-cell').forEach(c => c.classList.toggle('selected', parseInt(c.dataset.day,10) === state.daysPerWeek));
  });

  const timeGrid = document.getElementById('timeGrid');
  timeGrid.addEventListener('click', (e) => {
    const cell = e.target.closest('.time-cell');
    if (!cell) return;
    const id = cell.dataset.time;
    state.timeOption = (state.timeOption === id) ? null : id;
    timeGrid.querySelectorAll('.time-cell').forEach(c => c.classList.toggle('selected', c.dataset.time === state.timeOption));
  });

  document.querySelector('[data-action="back-step1"]').addEventListener('click', () => {
    state.screen = 'step1';
    render();
  });

  document.querySelector('[data-action="calculate"]').addEventListener('click', () => {
    if (!state.daysPerWeek || state.daysPerWeek < 1){
      showStep2Error('errDaysPerWeek');
      return;
    }
    const pagesPerDay = getDailyPagesPerDay();
    if (!(pagesPerDay > 0)){
      showStep2Error('errCustomPace');
      return;
    }
    clearStep2Error();
    state.screen = 'results';
    render();
  });
}

function bindResults(){
  const editBtn = document.querySelector('[data-action="edit-plan"]');
  if (editBtn) editBtn.addEventListener('click', () => {
    state.screen = 'step2';
    render();
  });
  const resetBtn = document.querySelector('[data-action="start-over"]');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    const currentLang = state.language;
    state = defaultState();
    state.language = currentLang;
    render();
  });
}

function bindLangToggle(){
  const toggle = document.getElementById('langToggle');
  if (!toggle) return;
  toggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-lang]');
    if (!btn) return;
    setLanguage(btn.dataset.lang);
  });
}

/* =========================================================
   INITIALIZATION
   ========================================================= */
function init(){
  bindLangToggle();
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
